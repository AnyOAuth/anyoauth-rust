[package]
name = "anyoauth-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
[[bin]]
name = "conformance"
path = "test/conformance/main.rs"
[profile.dev]
debug = 0
incremental = false
[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.145"
serde = "=1.0.228"
rand = "=0.8.5"
sha2 = "=0.10.9"
base64 = "=0.22.1"
url = "=2.5.7"
regex = "=1.12.2"
